[package]
name = "kate-ui"
description = "GPUI shell: one window, a read-only editor element, and frame-time telemetry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
kate-core = { workspace = true }
kate-text = { workspace = true }
# `FrameSample` is a serde type. The JSON line uses this derive.
serde = { version = "1", features = ["derive"] }
# One JSON object per stderr line. `Serialize` does not write bytes by itself.
serde_json = "1"

# GPUI's build script compiles Metal shaders. That step needs a macOS host.
# Other targets do not link these crates. `run` prints an error and exits there.
[target.'cfg(target_os = "macos")'.dependencies]
kate-syntax = { workspace = true }
# Metal window, Core Text shaping, and NSTextInputClient. Pinned. A bump is a new packet.
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }

[lints]
workspace = true
