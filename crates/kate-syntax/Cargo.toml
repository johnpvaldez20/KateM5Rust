[package]
name = "kate-syntax"
description = "KSyntaxHighlighting-compatible definitions, highlighting engine and themes. Operates on lines, knows nothing about buffers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
fancy-regex = "0.20.0"
lru = "0.19.0"
quick-xml = { version = "0.42.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.16.4"

[lints]
workspace = true
