[package]
name = "kate-search"
description = "Plain and regular-expression search and replace over a text buffer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license = "LGPL-2.1-or-later"

[dependencies]
kate-text = { version = "0.1.0", path = "../kate-text" }
regex = "1.13.1"
regex-cursor = "0.1.5"
ropey = { version = "1.6", default-features = false, features = ["simd"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
