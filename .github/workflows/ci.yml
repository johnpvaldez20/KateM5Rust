# The only evidence Gate 3 accepts. Runs on the exact commit SHA of every PR
# head and every push to main. See docs/governance/GOVERNANCE_LINUS.md §VII.
#
# Two runners: ubuntu-24.04 is cheap and tests every platform-independent
# crate; macos-15 (arm64) is the product target. Both are required checks.
# Actions are pinned by commit SHA; the Rust toolchain is pinned by
# rust-toolchain.toml and installed explicitly so that nothing floats.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Assert upstream sources are absent and never referenced by a manifest
        shell: bash
        run: |
          set -euo pipefail
          for d in upstream/kate upstream/ktexteditor upstream/syntax-highlighting; do
            if [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "::error::$d is checked out in CI; upstream is read-only reference material"
              exit 1
            fi
          done
          if grep -rn --include=Cargo.toml 'upstream/' --exclude-dir=target --exclude-dir=upstream . ; then
            echo "::error::a Cargo manifest references upstream/"
            exit 1
          fi
          echo "upstream/ is absent and unreferenced"

      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt,clippy,rust-src --target aarch64-apple-darwin
          rustup show active-toolchain
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --workspace --locked

      - name: test
        run: cargo test --workspace --locked

      - name: doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: gatecheck
        run: cargo run -p gatecheck --locked

      - name: spdx headers
        run: cargo test -p gatecheck --locked --test spdx_headers

      - name: check the product target from Linux
        if: runner.os == 'Linux'
        run: cargo check --workspace --locked --target aarch64-apple-darwin
